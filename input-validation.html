<!DOCTYPE html>
<html>
<head>
    <title>Input Validation</title>
</head>
<body>

    <h3>Enter Age</h3>
    <input id="age" type="number">
    <button onclick="checkAge()">Submit</button>

    <p id="msg"></p>

    <script>
        function checkAge() {
            const age = document.getElementById("age").value;
            if (age >= 18) {
                document.getElementById("msg").innerText = "Eligible";
            } else {
                document.getElementById("msg").innerText = "Not Eligible";
            }
        }
    </script>

</body>
</html>
