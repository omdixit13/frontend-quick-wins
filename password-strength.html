<!DOCTYPE html>
<html>
<head>
    <title>Password Strength</title>
</head>
<body>

    <h3>Password Strength Checker</h3>
    <input type="password" id="pwd" onkeyup="check()">
    <p id="strength"></p>

    <script>
        function check() {
            const pwd = document.getElementById("pwd").value;
            let strength = "Weak";

            if (pwd.length > 8) strength = "Medium";
            if (pwd.length > 12) strength = "Strong";

            document.getElementById("strength").innerText = strength;
        }
    </script>

</body>
</html>
